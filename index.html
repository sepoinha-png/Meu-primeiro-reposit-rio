<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="./img/CSS-Icon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <title>Gerador CSS com I.A.</title>
</head>

<body>
    <h1>
        CSS Gerador <span>com I.A.</span>🤖
    </h1>

    <p>
        Descreva o que você imaginar e veja a mágica acontecer
    </p>

    <textarea class="caixa-texto" rows="4" cols="50"></textarea>

    <button class="botao-gerar">✨Gerar código✨</button>

    <div class="resultado">

        <div class="codigo">
            <h2>Código</h2>
            <p class="bloco-codigo"></p>
        </div>

        <div class="preview">
            <h2>Preview</h2>
            <iframe class="resultado-codigo"></iframe>
        </div>

    </div>

</body>

<script src="scripts.js"></script>


</html>
